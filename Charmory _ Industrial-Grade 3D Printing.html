<style>
  /* Intentionally dark-only brand palette; tokens kept in one place. */
  :root {
    color-scheme: dark;
    --bg: #121212;          /* logo black */
    --panel: #1a1a1c;
    --line: #2f3034;
    --text: #F3F7F8;
    --muted: #9fa2a8;
    --accent: #E31D5B;      /* logo pink */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .display { font-family: 'Hanken Grotesk', 'IBM Plex Sans', system-ui, sans-serif; letter-spacing: -0.02em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .blueprint {
    background-image:
      linear-gradient(rgba(243,247,248,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(243,247,248,.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .layer-lines { background-image: repeating-linear-gradient(0deg, rgba(227,29,91,.10) 0 1px, transparent 1px 6px); }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel-in { animation: panelIn .28s ease-out; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .sheet-in { animation: sheetIn .22s ease-out; }
  input[type=range] { accent-color: #E31D5B; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  select option { background: #1a1a1c; color: #F3F7F8; }
</style>

  const inputCls = 'w-full rounded-md border border-slate-600 bg-slate-900 px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-accent focus:outline-none';
  const wrap = 'mx-auto w-full max-w-7xl px-5 sm:px-8';

  /* ---------- Modal ---------- */
  function Modal({ open, onClose, title, children, wide }) {
    const ref = useRef(null);
    useEffect(() => {
      if (!open) return;
      const prev = document.activeElement;
      const onKey = (e) => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', onKey);
      document.body.style.overflow = 'hidden';
      if (ref.current) ref.current.focus();
      return () => {
        document.removeEventListener('keydown', onKey);
        document.body.style.overflow = '';
        if (prev && prev.focus) prev.focus();
      };
    }, [open]);
    if (!open) return null;
    return html`
      <div className="fixed inset-0 z-[60] flex items-end justify-center sm:items-center sm:p-6">
        <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick=${onClose}></div>
        <div ref=${ref} tabIndex="-1" role="dialog" aria-modal="true" aria-label=${title}
          className=${'sheet-in relative flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-2xl border border-slate-700 bg-char shadow-2xl sm:rounded-2xl ' + (wide ? 'sm:max-w-5xl' : 'sm:max-w-xl')}>
          <div className="flex items-center justify-between border-b border-slate-700 px-5 py-4 sm:px-6">
            <h2 className="flex items-center gap-3 text-xl font-extrabold text-white"><img src=${A.mascotPink} alt="" className="h-8 w-auto" />${title}</h2>
            <button onClick=${onClose} aria-label="Close dialog" className="rounded-md p-2 text-slate-400 hover:bg-slate-800 hover:text-white">
              <${Icon} name="x" size=${20} />
            </button>
          </div>
          <div className="overflow-y-auto px-5 py-5 sm:px-6" style=${{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}>${children}</div>
        </div>
      </div>`;
  }

  /* ---------- Quote engine ---------- */
  function QuoteEngine({ preset, compact }) {
    const [file, setFile] = useState(null);
    const [status, setStatus] = useState('idle'); // idle | uploading | ready | error
    const [progress, setProgress] = useState(0);
    const [error, setError] = useState('');
    const [dragging, setDragging] = useState(false);
    const [material, setMaterial] = useState('pla');
    const [infill, setInfill] = useState(20);
    const [qty, setQty] = useState(1);
    const [ref, setRef] = useState(null);
    const timer = useRef(null);
    const input = useRef(null);

    useEffect(() => { if (preset) setMaterial(preset.material); }, [preset && preset.k]);
    useEffect(() => () => clearInterval(timer.current), []);

    const handleFile = (f) => {
      if (!f) return;
      const ext = f.name.split('.').pop().toLowerCase();
      if (!ACCEPTED.includes(ext)) {
        setStatus('error'); setFile(null);
        setError('Unsupported file type. Upload a .STL, .STEP, .OBJ or .IGS file.');
        return;
      }
      clearInterval(timer.current);
      setError(''); setFile({ name: f.name, size: f.size }); setStatus('uploading'); setProgress(0);
      timer.current = setInterval(() => {
        setProgress((p) => {
          const next = Math.min(100, p + 6 + Math.random() * 10);
          if (next >= 100) { clearInterval(timer.current); setStatus('ready'); }
          return next;
        });
      }, 120);
    };
    const clearFile = () => { clearInterval(timer.current); setFile(null); setStatus('idle'); setProgress(0); setError(''); if (input.current) input.current.value = ''; };

    const mat = MATERIALS.find((m) => m.id === material);
    const vol = file ? Math.round(10 + ((file.size / 1024) % 90)) : 30;
    const unit = mat.rate * vol * (0.55 + (infill / 100) * 0.9);
    const disc = qty >= 100 ? 0.15 : qty >= 25 ? 0.1 : qty >= 10 ? 0.05 : 0;
    const printTotal = unit * qty;
    const discount = printTotal * disc;
    const total = 45 + printTotal - discount;
    const days = 3 + mat.extra + (qty >= 25 ? 2 : qty >= 10 ? 1 : 0);
    const setQ = (v) => setQty(Math.max(1, Math.min(10000, parseInt(v, 10) || 1)));

    if (ref) {
      return html`
        <div className="panel-in rounded-xl border border-accent/40 bg-accent/5 p-8 text-center">
          <img src=${A.mascotPink} alt="" className="mx-auto mb-4 h-20 w-auto" />
          <h3 className="text-2xl font-extrabold text-white">Quote request ${ref} sent</h3>
          <p className="mx-auto mt-2 max-w-md text-slate-300">We received ${file ? file.name : 'your file'} (${mat.label}, ${infill}% infill, ${qty} ${qty === 1 ? 'unit' : 'units'}). A Charmory engineer will confirm geometry and send a formal quote.</p>
          <button onClick=${() => { setRef(null); clearFile(); setQty(1); }} className=${btnGhost + ' mt-6'}>Start another quote</button>
        </div>`;
    }

    return html`
      <div className=${'grid gap-8 ' + (compact ? 'md:grid-cols-[1.25fr_1fr]' : 'lg:grid-cols-[1.4fr_1fr]')}>
        <div className="flex flex-col gap-6">
          <input ref=${input} type="file" className="sr-only" tabIndex="-1" accept=".stl,.step,.stp,.obj,.igs,.iges"
            onChange=${(e) => handleFile(e.target.files[0])} />
          ${!file || status === 'error' ? html`
            <div role="button" tabIndex="0" aria-label="Upload CAD file"
              onClick=${() => input.current.click()}
              onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.current.click(); } }}
              onDragOver=${(e) => { e.preventDefault(); setDragging(true); }}
              onDragLeave=${() => setDragging(false)}
              onDrop=${(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
              className=${'flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed px-6 py-12 text-center transition ' + (dragging ? 'border-accent bg-accent/10' : 'border-slate-600 bg-slate-900/50 hover:border-accent/70')}>
              <span className="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-slate-800 text-accent-soft"><${Icon} name="upload" size=${22} /></span>
              <p className="max-w-xs font-medium text-white">Drag & Drop CAD Files here (.STL, .STEP, .OBJ, .IGS)</p>
              <p className="mt-2 text-sm text-slate-400">or click to browse your files</p>
            </div>
            ${error && html`<p role="alert" className="-mt-3 text-sm text-red-300">${error}</p>`}
          ` : html`
            <div className="panel-in rounded-xl border border-slate-600 bg-slate-900/50 p-5">
              <div className="flex items-start gap-3">
                <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-slate-800 text-accent-soft"><${Icon} name="file" size=${20} /></span>
                <div className="min-w-0 flex-1">
                  <p className="truncate font-medium text-white">${file.name}</p>
                  <p className="text-sm text-slate-400">${(file.size / 1024).toFixed(file.size > 1048576 ? 0 : 1)} KB ${status === 'ready' ? '· Geometry analyzed · ' + vol + ' cm³ estimated volume' : '· Uploading securely'}</p>
                </div>
                <button onClick=${clearFile} aria-label="Remove file" className="rounded-md p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white"><${Icon} name="x" size=${18} /></button>
              </div>
              <div className="mt-4 h-1.5 overflow-hidden rounded-full bg-slate-700" role="progressbar" aria-valuenow=${Math.round(progress)} aria-valuemin="0" aria-valuemax="100">
                <div className="h-full rounded-full bg-accent transition-all" style=${{ width: progress + '%' }}></div>
              </div>
              ${status === 'ready' && html`<p className="mt-3 flex items-center gap-2 text-sm text-accent-soft"><${Icon} name="check" size=${16} sw=${2.5} /> Mutual NDA executed. File ready for quoting.</p>`}
            </div>`}

          <p className="flex items-center gap-2 text-sm text-slate-300">🔒 Secured under automated mutual NDA upon upload.</p>

          <div className="grid gap-6 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <label htmlFor=${'material' + (compact ? '-m' : '')} className="mb-2 block text-sm font-medium text-slate-200">Material</label>
              <div className="relative">
                <select id=${'material' + (compact ? '-m' : '')} value=${material} onChange=${(e) => setMaterial(e.target.value)}
                  className=${inputCls + ' appearance-none pr-10'}>
                  ${MATERIALS.map((m) => html`<option key=${m.id} value=${m.id}>${m.label}</option>`)}
                </select>
                <${Icon} name="chevronDown" size=${18} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
              </div>
            </div>
            <div className="sm:col-span-2">
              <div className="mb-2 flex items-baseline justify-between">
                <label htmlFor=${'infill' + (compact ? '-m' : '')} className="text-sm font-medium text-slate-200">Infill Density</label>
                <span className="text-sm tabular-nums text-white">${infill}%${infill === 20 ? ' · Standard' : ''}</span>
              </div>
              <input id=${'infill' + (compact ? '-m' : '')} type="range" min="10" max="100" step="5" value=${infill}
                onChange=${(e) => setInfill(+e.target.value)} className="w-full" />
              <div className="mt-1 flex justify-between text-xs text-slate-400"><span>10%</span><span>100%</span></div>
            </div>
            <div>
              <label htmlFor=${'qty' + (compact ? '-m' : '')} className="mb-2 block text-sm font-medium text-slate-200">Quantity</label>
              <div className="flex w-full max-w-[200px] items-stretch overflow-hidden rounded-md border border-slate-600">
                <button onClick=${() => setQ(qty - 1)} aria-label="Decrease quantity" className="px-3 text-slate-300 hover:bg-slate-800 hover:text-white"><${Icon} name="minus" size=${16} /></button>
                <input id=${'qty' + (compact ? '-m' : '')} type="number" min="1" value=${qty} onChange=${(e) => setQ(e.target.value)}
                  className="w-full bg-slate-900 py-2.5 text-center text-sm tabular-nums text-white focus:outline-none" />
                <button onClick=${() => setQ(qty + 1)} aria-label="Increase quantity" className="px-3 text-slate-300 hover:bg-slate-800 hover:text-white"><${Icon} name="plus" size=${16} /></button>
              </div>
            </div>
          </div>
        </div>

        <aside className="h-fit rounded-xl border border-slate-700 bg-slate-900 p-6 lg:sticky lg:top-24" aria-live="polite">
          <p className="text-sm text-slate-400">Estimated total</p>
          <p className="display mt-1 text-5xl font-extrabold tabular-nums text-white">${usd(total)}</p>
          <p className="mt-1 text-sm text-slate-400">${usd(total / qty)} per unit at ${qty} ${qty === 1 ? 'unit' : 'units'}</p>
          <dl className="mt-5 space-y-2 border-t border-slate-700 pt-5 text-sm">
            <div className="flex justify-between"><dt className="text-slate-400">Setup & NDA handling</dt><dd className="tabular-nums text-slate-200">${usd(45)}</dd></div>
            <div className="flex justify-between"><dt className="text-slate-400">${mat.label.split(' (')[0]} × ${qty}</dt><dd className="tabular-nums text-slate-200">${usd(printTotal)}</dd></div>
            ${disc > 0 && html`<div className="flex justify-between"><dt className="text-accent-soft">Volume discount (${Math.round(disc * 100)}%)</dt><dd className="tabular-nums text-accent-soft">−${usd(discount)}</dd></div>`}
          </dl>
          <div className="mt-5 flex items-center gap-2 rounded-md bg-slate-800 px-3 py-2.5 text-sm text-white">
            <${Icon} name="clock" size=${18} className="text-accent-soft" /> Est. Delivery: ${days} Days
          </div>
          ${!file && html`<p className="mt-4 text-xs text-slate-400">Showing a sample 30 cm³ part. Upload a CAD file to price your geometry.</p>`}
          <button disabled=${status !== 'ready'} onClick=${() => setRef('CHM-' + Math.floor(10000 + Math.random() * 90000))}
            className=${btnPrimary + ' mt-5 w-full'}>Send Quote Request</button>
          ${status !== 'ready' && html`<p className="mt-2 text-center text-xs text-slate-400">Upload a CAD file to request a formal quote.</p>`}
        </aside>
      </div>`;
  }

  /* ---------- Request forms (RFQ + consumer) ---------- */
  function FormModal({ kind, onClose }) {
    const [sent, setSent] = useState(false);
    useEffect(() => { if (kind) setSent(false); }, [kind]);
    const rfq = kind === 'rfq';
    return html`
      <${Modal} open=${!!kind} onClose=${onClose} title=${rfq ? 'Request Enterprise RFQ' : 'Submit Consumer Custom Order'}>
        ${sent ? html`
          <div className="panel-in py-6 text-center">
            <img src=${A.mascotPink} alt="" className="mx-auto mb-4 h-20 w-auto" />
            <h3 className="text-xl font-extrabold text-white">Request received</h3>
            <p className="mx-auto mt-2 max-w-sm text-slate-300">A Charmory engineer will follow up by email${rfq ? ' with a scoped quote and framework terms' : ' to confirm your file and pricing'}.</p>
            <button onClick=${onClose} className=${btnGhost + ' mt-6'}>Close</button>
          </div>` : html`
          <form className="grid gap-4" onSubmit=${(e) => { e.preventDefault(); setSent(true); }}>
            <p className="text-sm text-slate-300">${rfq ? 'Tell us about the program. Anything proprietary is covered by our automatic mutual NDA.' : 'Share what you want made. A single piece or a small run is fine.'}</p>
            <div className="grid gap-4 sm:grid-cols-2">
              <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-name">Full name</label><input id="f-name" required className=${inputCls} autoComplete="name" /></div>
              <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-email">${rfq ? 'Work email' : 'Email'}</label><input id="f-email" type="email" required className=${inputCls} autoComplete="email" /></div>
            </div>
            ${rfq && html`
              <div className="grid gap-4 sm:grid-cols-2">
                <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-co">Company</label><input id="f-co" required className=${inputCls} autoComplete="organization" /></div>
                <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-vert">Program type</label>
                  <select id="f-vert" className=${inputCls}>
                    <option>Product Prototyping</option><option>Corporate Gifting</option><option>Medical & Educational</option>
                  </select></div>
              </div>`}
            <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-qty">${rfq ? 'Estimated annual volume (units)' : 'Quantity'}</label><input id="f-qty" type="number" min="1" className=${inputCls} /></div>
            <div><label className="mb-1.5 block text-sm font-medium text-slate-200" htmlFor="f-msg">${rfq ? 'Project details' : 'What would you like made?'}</label><textarea id="f-msg" rows="4" required className=${inputCls}></textarea></div>
            <button type="submit" className=${btnPrimary}>${rfq ? 'Send RFQ' : 'Send custom order'}</button>
          </form>`}
      <//>`;
  }

  /* ---------- Hero: the Charmory mascot, printed layer by layer ---------- */
  function PrintViz() {
    const [p, setP] = useState(0);
    useEffect(() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setP(1); return; }
      let raf; const start = performance.now();
      const tick = (now) => { const t = ((now - start) % 12000) / 12000; setP(Math.min(1, t / 0.82)); raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, []);
    const layer = Math.max(1, Math.round(p * 240));
    const fromTop = (1 - p) * 100;                       // % from top of the part where the print line sits
    const amp = (1 - p) > 0.22 ? (p < 0.06 ? 28 : 40) : 9; // nozzle sweep width follows the silhouette
    const nx = p >= 1 ? 50 : 50 + Math.sin(p * 120) * amp;
    return html`
      <figure className="m-0 overflow-hidden rounded-2xl border border-slate-700 bg-char">
        <div className="flex justify-center px-6 pb-2 pt-10 sm:px-10">
          <div className="relative w-full max-w-[300px]" style=${{ aspectRatio: String(A.mascotRatio) }} role="img" aria-label="The Charmory mascot being printed layer by layer">
            <img src=${A.mascotPink} alt="" className="absolute inset-0 h-full w-full opacity-[0.12]" />
            <div className="absolute inset-0" style=${{ clipPath: 'inset(' + fromTop + '% 0 0 0)' }}>
              <img src=${A.mascotPink} alt="" className="h-full w-full" />
              <div className="absolute inset-0" style=${{ backgroundImage: 'repeating-linear-gradient(0deg, rgba(26,26,28,.55) 0 1.5px, transparent 1.5px 7px)' }}></div>
            </div>
            ${p < 1 && html`
              <div className="absolute left-[-14%] right-[-14%] h-[3px] rounded bg-slate-600" style=${{ top: 'calc(' + fromTop + '% - 26px)' }}></div>
              <div className="absolute" style=${{ left: nx + '%', top: fromTop + '%', transform: 'translate(-50%, -100%)' }}>
                <div className="mx-auto h-4 w-8 rounded-sm bg-slate-500"></div>
                <div className="mx-auto h-0 w-0 border-x-[7px] border-t-[12px] border-x-transparent border-t-accent-soft"></div>
              </div>`}
          </div>
        </div>
        <div className="mx-6 h-2 rounded bg-slate-700 sm:mx-10"></div>
        <figcaption className="flex items-center justify-between px-6 py-4 text-sm sm:px-10">
          <span className="tabular-nums text-slate-300">Layer ${layer} / 240</span>
          <span className="tabular-nums text-accent-soft">${Math.round(p * 100)}%</span>
        </figcaption>
      </figure>`;
  }

  /* ---------- Navigation ---------- */
  function Nav({ onQuote, onService }) {
    const [mobile, setMobile] = useState(false);
    const [svc, setSvc] = useState(false);
    const dd = useRef(null);
    useEffect(() => {
      const click = (e) => { if (dd.current && !dd.current.contains(e.target)) setSvc(false); };
      const key = (e) => { if (e.key === 'Escape') { setSvc(false); setMobile(false); } };
      document.addEventListener('mousedown', click); document.addEventListener('keydown', key);
      return () => { document.removeEventListener('mousedown', click); document.removeEventListener('keydown', key); };
    }, []);
    const link = 'rounded-md px-3 py-2 text-sm font-medium text-slate-300 transition hover:text-white';
    const pick = (id) => { onService(id); setSvc(false); setMobile(false); };
    return html`
      <header className="sticky z-50 border-b border-slate-800 bg-slate-900/90 backdrop-blur" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
        <nav className=${wrap + ' flex h-16 items-center justify-between'} aria-label="Primary">
          <a href="#top" onClick=${(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="flex items-center gap-2.5">
            <img src=${A.wordmark} alt="Charmory" className="h-8 w-auto" />
          </a>

          <div className="hidden items-center gap-1 lg:flex">
            <div className="relative" ref=${dd} onMouseEnter=${() => setSvc(true)} onMouseLeave=${() => setSvc(false)}>
              <button className=${link + ' inline-flex items-center gap-1'} aria-haspopup="menu" aria-expanded=${svc} onClick=${() => setSvc(!svc)}>
                Services <${Icon} name="chevronDown" size=${16} className=${'transition ' + (svc ? 'rotate-180' : '')} />
              </button>
              ${svc && html`
                <div role="menu" className="panel-in absolute left-0 top-full w-60 pt-2">
                  <div className="rounded-lg border border-slate-700 bg-char p-1.5 shadow-xl">
                    ${SERVICE_MENU.map((s) => html`
                      <button key=${s.id} role="menuitem" onClick=${() => pick(s.id)}
                        className="flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm text-slate-200 hover:bg-slate-800 hover:text-accent-soft">
                        <${Icon} name=${s.icon} size=${18} className="text-accent-soft" /> ${s.label}
                      </button>`)}
                  </div>
                </div>`}
            </div>
            <a href="#about" className=${link}>About</a>
            <a href="#contact" className=${link}>Contact</a>
            <button onClick=${onQuote} className=${btnPrimary + ' ml-3 !py-2.5'}><${Icon} name="upload" size=${16} /> Instant Quote & Upload</button>
          </div>

          <button className="rounded-md p-2 text-slate-200 hover:bg-slate-800 lg:hidden" aria-label=${mobile ? 'Close menu' : 'Open menu'} aria-expanded=${mobile} onClick=${() => setMobile(!mobile)}>
            <${Icon} name=${mobile ? 'x' : 'menu'} size=${24} />
          </button>
        </nav>
        ${mobile && html`
          <div className="panel-in border-t border-slate-800 bg-slate-900 lg:hidden">
            <div className=${wrap + ' flex flex-col gap-1 py-4'}>
              <p className="px-3 pb-1 pt-2 text-sm text-slate-400">Services</p>
              ${SERVICE_MENU.map((s) => html`
                <button key=${s.id} onClick=${() => pick(s.id)} className="flex items-center gap-3 rounded-md px-3 py-3 text-left text-slate-200 hover:bg-slate-800">
                  <${Icon} name=${s.icon} size=${18} className="text-accent-soft" /> ${s.label}
                </button>`)}
              <a href="#about" onClick=${() => setMobile(false)} className="rounded-md px-3 py-3 text-slate-200 hover:bg-slate-800">About</a>
              <a href="#contact" onClick=${() => setMobile(false)} className="rounded-md px-3 py-3 text-slate-200 hover:bg-slate-800">Contact</a>
              <button onClick=${() => { setMobile(false); onQuote(); }} className=${btnPrimary + ' mt-3'}><${Icon} name="upload" size=${16} /> Instant Quote & Upload</button>
            </div>
          </div>`}
      </header>`;
  }

  /* ---------- Verticals ---------- */
  const Metric = ({ m }) => {
    const i = m.indexOf(': ');
    return i > 0
      ? html`<div className="text-lg"><span className="text-slate-400">${m.slice(0, i + 1)}</span> <span className="font-semibold text-white">${m.slice(i + 2)}</span></div>`
      : html`<div className="text-lg font-semibold text-white">${m}</div>`;
  };

  function Verticals({ active, setActive, onQuoteVertical }) {
    const idx = VERTICALS.findIndex((v) => v.id === active);
    const v = VERTICALS[idx];
    const onKey = (e) => {
      let n = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (idx + 1) % 3;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (idx + 2) % 3;
      if (n !== null) { e.preventDefault(); setActive(VERTICALS[n].id); document.getElementById('tab-' + VERTICALS[n].id).focus(); }
    };
    return html`
      <section id="services" className="py-16 lg:py-24">
        <div className=${wrap}>
          <h2 className="max-w-3xl text-4xl font-extrabold text-white sm:text-5xl">Manufacturing for engineering, brand, and clinical teams</h2>
          <div className="mt-12 grid gap-8 lg:grid-cols-[320px_1fr]">
            <div role="tablist" aria-label="B2B verticals" onKeyDown=${onKey} className="flex gap-2 overflow-x-auto lg:flex-col lg:overflow-visible">
              ${VERTICALS.map((t) => html`
                <button key=${t.id} id=${'tab-' + t.id} role="tab" aria-selected=${t.id === active} aria-controls="vertical-panel"
